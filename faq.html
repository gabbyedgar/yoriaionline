<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Yoriai</title>
<meta name="description" content="Common questions about joining activities, hosting, safety, and the Osaka launch.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FAF7F4">
</head>
<body>

<section class="sec" style="padding-bottom:clamp(32px,4vw,48px)">
  <div class="wrap maxw-lg">
    <div class="kicker reveal">Questions</div>
    <h1 class="display reveal d1" style="margin-top:20px">Good questions,<br>honest answers.</h1>
    <p class="lede reveal d2" style="margin-top:22px;max-width:560px">Still curious after this? We read every message during the beta — reach out and a real person replies.</p>
    <div class="faq-tabs reveal d3" id="faqTabs"></div>
  </div>
</section>

<section class="sec" style="padding-top:0">
  <div class="wrap maxw-lg">
    <div id="faqList"></div>
  </div>
</section>

<section class="sec-tight bg-2" style="padding-bottom:clamp(72px,9vw,110px)">
  <div class="wrap center">
    <div class="reveal" data-torii="48"></div>
    <h2 class="h1 reveal d1" style="margin-top:16px">Still wondering something?</h2>
    <p class="lede reveal d2" style="margin-top:12px">We'd love to hear it.</p>
    <div class="reveal d3" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px">
      <a class="btn btn-terra btn-lg" href="index.html#waitlist">Join the waitlist</a>
      <a class="btn btn-ghost btn-lg" href="mailto:hello@yoriai.jp">Email us</a>
    </div>
  </div>
</section>


<script type="module" src="/src/pages/faq.ts"></script>

<style>
@keyframes rise{ from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
.faq-tabs{ display:flex; gap:8px; margin-top:32px; flex-wrap:wrap; }
.ftab{ padding:9px 18px; border-radius:100px; border:1px solid var(--border-2); background:var(--surface);
  font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:all .2s; }
.ftab:hover{ border-color:var(--ink); }
.ftab.active{ background:var(--terra); color:#fff; border-color:var(--terra); }

.qa{ border-bottom:1px solid var(--border); }
.qa-q{ width:100%; display:flex; justify-content:space-between; align-items:center; gap:20px; text-align:left;
  background:none; border:0; padding:24px 4px; cursor:pointer; font-family:var(--font-serif); font-size:clamp(19px,2vw,23px);
  color:var(--ink); transition:color .2s; }
.qa-q:hover{ color:var(--terra); }
.qa-ico{ font-family:var(--font-sans); font-size:24px; color:var(--terra); flex:none; width:28px; text-align:center; transition:transform .2s; }
.qa-q[aria-expanded="true"] .qa-ico{ transform:rotate(180deg); }
.qa-a{ overflow:hidden; }
.qa-a-inner{ display:none; }
.qa-a.open .qa-a-inner{ display:block; }
@media (prefers-reduced-motion:no-preference){
  .qa-a.open .qa-a-inner{ animation:faqOpen .4s var(--ease); }
}
@keyframes faqOpen{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:none; } }
.qa-a-inner p{ margin:0; max-width:640px; color:var(--ink-soft); font-size:16.5px; line-height:1.65; padding:0 4px 26px; }
</style>
</body>
</html>
