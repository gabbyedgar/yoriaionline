<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse activities — live this week in Osaka | Yoriai</title>
<meta name="description" content="The live feed of everyday activities Osaka locals are doing this week. Sorted by soon and nearby.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FAF7F4">
</head>
<body>

<!-- feed header -->
<section style="padding:clamp(28px,4vw,48px) 0 0">
  <div class="wrap-wide">
    <div class="browse-head reveal">
      <div>
        <div class="kicker">Live feed · Osaka 大阪</div>
        <h1 class="h1" style="margin-top:14px">What's happening this week</h1>
      </div>
      <div class="live-pill"><span class="dot pulse"></span> <span id="liveCount"></span> activities live now</div>
    </div>

    <!-- controls -->
    <div class="controls reveal d1">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="search" placeholder="Search activities, hosts, neighborhoods…">
      </div>
      <div class="sortwrap">
        <span class="mono" style="font-size:11px">Sort</span>
        <div class="seg seg-sort" id="sortSeg">
          <button class="seg-btn active" data-sort="soon">Soon &amp; nearby</button>
          <button class="seg-btn" data-sort="rated">Top rated</button>
          <button class="seg-btn" data-sort="popular">Most popular</button>
        </div>
      </div>
    </div>

    <!-- category chips -->
    <div class="chips reveal d2" id="chips"></div>
  </div>
</section>

<!-- grid -->
<section class="sec" style="padding-top:clamp(28px,3vw,40px)">
  <div class="wrap-wide">
    <div class="feed-grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div data-torii="44"></div>
      <h3 class="h3" style="margin-top:14px">Nothing matches — yet.</h3>
      <p class="muted">Be the first to create one, or clear your filters.</p>
      <button class="btn btn-ghost" id="clearBtn">Clear filters</button>
    </div>
  </div>
</section>

<!-- host CTA band -->
<section class="sec-tight bg-2">
  <div class="wrap host-band">
    <div class="reveal">
      <div class="kicker">See a gap?</div>
      <h2 class="h2" style="margin-top:12px">The best activity this week is the one you haven't posted.</h2>
    </div>
    <a class="btn btn-primary btn-lg reveal d1" href="hosts.html#apply">Become a host <span class="arr">→</span></a>
  </div>
</section>


<script type="module" src="/src/pages/browse.ts"></script>

<style>
@keyframes rise{ from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
.browse-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; }
.live-pill{ display:inline-flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border);
  padding:9px 15px; border-radius:100px; box-shadow:var(--shadow-sm); font-size:13.5px; font-weight:500; color:var(--ink-soft); }

.controls{ display:flex; gap:16px; align-items:center; margin-top:28px; flex-wrap:wrap; }
.search{ flex:1; min-width:240px; display:flex; align-items:center; gap:10px; background:var(--surface);
  border:1px solid var(--border-2); border-radius:100px; padding:11px 18px; color:var(--muted); transition:border-color .2s,box-shadow .2s; }
.search:focus-within{ border-color:var(--terra); box-shadow:0 0 0 3px var(--terra-tint); }
.search input{ border:0; outline:0; background:transparent; flex:1; font-family:var(--font-sans); font-size:15px; color:var(--ink); }
.sortwrap{ display:flex; align-items:center; gap:10px; }
.seg-sort{ display:flex; gap:4px; background:var(--bg-2); border:1px solid var(--border); border-radius:100px; padding:4px; }
.seg-sort .seg-btn{ padding:8px 14px; border:0; background:transparent; border-radius:100px; font-size:13.5px; font-weight:600; color:var(--muted); transition:all .2s; white-space:nowrap; }
.seg-sort .seg-btn.active{ background:var(--ink); color:var(--bg); }

.chips{ display:flex; gap:9px; margin-top:18px; flex-wrap:wrap; }
.chip{ padding:8px 16px; border-radius:100px; border:1px solid var(--border-2); background:var(--surface);
  font-size:13.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; transition:all .2s; }
.chip:hover{ border-color:var(--ink); }
.chip.active{ background:var(--terra); color:#fff; border-color:var(--terra); }

.acard-blurb{ font-size:14px; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin:0; }

.empty{ text-align:center; padding:80px 20px; }
.host-band{ display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap; }
.host-band h2{ max-width:560px; }
@media (max-width:680px){ .controls{ flex-direction:column; align-items:stretch; } .sortwrap{ justify-content:space-between; } .seg-sort{ flex:1; } .seg-sort .seg-btn{ flex:1; text-align:center; } }
</style>
</body>
</html>
